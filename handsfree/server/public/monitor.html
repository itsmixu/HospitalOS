<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumi · Camera test monitor</title><style>body{margin:0;background:#26302e;color:white;font:16px system-ui;text-align:center}header{padding:8px}h1{font-size:22px;margin:6px}p{font-size:13px}button{font-size:14px!important;padding:6px!important;margin:4px!important}input{width:58px!important;padding:5px!important}input{width:70px;padding:8px;font:inherit}button{padding:10px;margin:8px;font:inherit}canvas{display:block;margin:12px auto;width:min(92vw,calc(133vh - 240px),1000px);height:auto;image-rendering:pixelated;background:#ebebeb}p{margin:10px}body:fullscreen canvas{width:min(95vw,128vh);margin:auto}body:fullscreen header{display:none}</style><header><h1>Camera test monitor</h1><p>Synthetic values only · HOS-BP-1 · face the panel straight on</p><label>SYS <input id="sys" type="number" min="0" max="999" value="124"></label> <label>DIA <input id="dia" type="number" min="0" max="999" value="82"></label> <label>Pulse <input id="pulse" type="number" min="0" max="999" value="72"></label><button id="apply">Update monitor</button><button id="random">New values</button><button id="full">Full screen</button><p>No connection to the glasses or record service. Values are drawn as pixels only.</p></header><canvas width="480" height="360" aria-label="Synthetic blood pressure monitor"></canvas><script>
const FONT={"H": "101101111101101", "O": "111101101101111", "S": "111100111001111", "B": "110101110101110", "P": "110101110100100", "Y": "101101010010010", "D": "110101101101110", "I": "111010010010111", "A": "010101111101101", "U": "101101101101111", "L": "100100100100111", "E": "111100110100111", "m": "000111111101101", "g": "000111101001111", "b": "100100110101110", "p": "000110101110100", "-": "000000111000000", "1": "010110010010111"},DIGITS=["abcdef", "bc", "abged", "abgcd", "fgbc", "afgcd", "afgecd", "abc", "abcdefg", "abcdfg"],RECTS={"a": [7, 2, 20, 5], "b": [27, 8, 5, 21], "c": [27, 35, 5, 21], "d": [7, 57, 20, 5], "e": [2, 35, 5, 21], "f": [2, 8, 5, 21], "g": [7, 30, 20, 5]};
const ctx=document.querySelector('canvas').getContext('2d');
function draw(){const values=['sys','dia','pulse'].map(id=>Number(document.getElementById(id).value));if(values.some(n=>!Number.isInteger(n)||n<0||n>999))return;ctx.fillStyle='#ebebeb';ctx.fillRect(0,0,480,360);ctx.fillStyle='#191919';const rect=(x,y,w,h)=>ctx.fillRect(x,y,w,h);function text(s,x,y){[...s].forEach((c,k)=>[...FONT[c]].forEach((b,i)=>{if(b==='1')rect(x+k*16+i%3*4,y+Math.floor(i/3)*4,4,4)}))};[[12,12,456,4],[12,344,456,4],[12,12,4,336],[464,12,4,336]].forEach(r=>rect(...r));text('HOS-BP-1',32,30);['SYS','DIA','PULSE'].forEach((label,row)=>{const y=72+row*88;text(label,32,y+20);text(row===2?'bpm':'mmHg',350,y+20);[...String(values[row]).padStart(3,'0')].forEach((n,slot)=>[...DIGITS[Number(n)]].forEach(a=>{const [x0,y0,w,h]=RECTS[a];rect(190+44*slot+x0,y+y0,w,h)}))});}
document.getElementById('apply').onclick=draw;document.getElementById('random').onclick=()=>{const a=new Uint32Array(3);crypto.getRandomValues(a);['sys','dia','pulse'].forEach((id,i)=>document.getElementById(id).value= [100,60,55][i]+a[i]%[65,45,55][i]);draw()};document.getElementById('full').onclick=()=>document.body.requestFullscreen();draw();</script></html>
