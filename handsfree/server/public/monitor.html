<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumi · Blood pressure monitor</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 40% 15%,#f5f7f6 0%,#dce3e3 65%,#ccd7d8 100%);color:#425052;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 18px;gap:22px}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #53878c;outline-offset:5px}.instrument{width:min(760px,94vw);padding:30px 30px 22px;border-radius:38px;background:linear-gradient(145deg,#fdfefd 0%,#f0f2ef 60%,#dce2de 100%);border:1px solid #fff;box-shadow:0 3px 0 #c3cecb,0 7px 0 #b7c3c0,0 28px 65px #344e4f33,inset 0 2px 3px #fff;position:relative}.instrument:after{content:'';position:absolute;bottom:-9px;left:13%;right:13%;height:6px;background:#9faeaa;border-radius:0 0 8px 8px;z-index:-1}.device-header{display:flex;justify-content:space-between;align-items:center;margin:0 4px 22px}.brand{font-size:25px;letter-spacing:-1px;font-weight:600;color:#526b70}.brand span{display:block;font-size:8px;font-weight:500;letter-spacing:2px;color:#9ca9a7;margin-top:5px}.device-type{text-align:right;font-size:11px;letter-spacing:1.5px;color:#5b7073}.device-type small{display:block;color:#99a6a5;font-size:8px;letter-spacing:1px;margin-top:6px}.face{display:grid;grid-template-columns:minmax(0,1fr) 100px;gap:24px;align-items:stretch}.screen-bezel{padding:10px;background:linear-gradient(135deg,#687776,#344544);border:1px solid #b0bbba;border-radius:12px;box-shadow:inset 0 2px 6px #0b20224a,0 2px 2px #fff;position:relative}.screen{overflow:hidden;border-radius:3px;border:1px solid #263b36;background:#ebebeb;box-shadow:inset 0 0 6px #273b3440;position:relative}canvas{display:block;width:100%;height:auto;aspect-ratio:4/3;image-rendering:auto;background:#ebebeb}.side{display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:15px 0 12px}.power{font-size:8px;color:#849490;letter-spacing:1.5px;display:flex;align-items:center;gap:7px}.led{width:7px;height:7px;background:#76a486;border:1px solid #6c977b;border-radius:50%;box-shadow:0 0 7px #91c49e66}.start{width:83px;height:83px;border-radius:50%;border:1px solid #5b7f83;background:linear-gradient(145deg,#739a9e,#466f75);box-shadow:0 4px 0 #34565b,0 6px 10px #23424930,inset 0 2px 2px #c6e6e244;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:8px;letter-spacing:1px}.start:active{transform:translateY(2px);box-shadow:0 2px 0 #34565b}.power-symbol{font-size:27px;line-height:1;font-weight:300;letter-spacing:0}.side-label{font-size:8px;color:#9ca9a5;letter-spacing:1.2px}.base{display:flex;align-items:center;justify-content:space-between;margin:22px 5px 0;gap:12px}.status{font-size:10px;letter-spacing:.3px;color:#6f837f;display:flex;align-items:center;gap:7px}.status:before{content:'';width:5px;height:5px;background:#7c9d8c;border-radius:50%}.vents{display:flex;gap:4px}.vents i{display:block;width:2px;height:12px;border-radius:1px;background:#b9c5c0;box-shadow:1px 0 #fff}.model{font:8px monospace;color:#a2aeaa;letter-spacing:1px}.desk{display:flex;align-items:center;justify-content:center;gap:12px;color:#7d908f;font-size:10px}.desk>button,.settings summary{border:1px solid #b6c5c555;background:#f3f7f34a;border-radius:6px;padding:8px 11px;color:#617876;font-size:10px}.settings{position:relative}.settings summary{cursor:pointer;list-style:none}.settings summary::-webkit-details-marker{display:none}.settings[open] summary{background:#fff}.settings-content{position:absolute;z-index:10;bottom:42px;left:50%;transform:translateX(-50%);width:300px;padding:18px;border-radius:12px;background:#f6f9f6;box-shadow:0 10px 45px #1b323633;border:1px solid #fff}.settings h2{font-size:13px;font-weight:500;margin:0 0 14px}.inputs{display:flex;gap:10px}label{font-size:9px;letter-spacing:.8px;color:#637e7a}input{display:block;margin-top:6px;width:78px;padding:8px;border:1px solid #cbd7d2;border-radius:5px;background:white;color:#28423e;font-size:15px}.settings-content button{width:100%;border:0;border-radius:5px;background:#4e767a;color:#fff;padding:10px;margin-top:14px;font-size:11px}.disclosure{font-size:9px;letter-spacing:.6px;color:#8b9d9b;text-align:center;margin:0}.error{color:#945544;font-size:10px;margin:10px 0 0}.measuring{position:absolute;inset:0;background:#e5ebe5;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;color:#455f54}.measuring[hidden]{display:none}.measuring span{font-size:12px;letter-spacing:1px}.spinner{width:25px;height:25px;border:2px solid #bdcdc2;border-top-color:#526e5d;border-radius:50%;animation:turn 1s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}body:fullscreen{padding:20px}body:fullscreen .desk,body:fullscreen>.disclosure{display:none}body:fullscreen .instrument{width:min(94vw,calc(150vh - 170px),1050px)}@media(max-width:600px){body{padding:24px 12px;gap:20px}.instrument{padding:23px 18px 20px;border-radius:28px}.face{grid-template-columns:minmax(0,1fr) 63px;gap:12px}.screen-bezel{padding:6px}.start{width:58px;height:58px;font-size:6px;gap:3px}.power-symbol{font-size:22px}.power{font-size:6px;gap:4px}.led{width:5px;height:5px}.side{padding:8px 0}.side-label{font-size:6px}.device-type{font-size:9px}.brand{font-size:23px}.model{display:none}.device-header{margin-bottom:18px}.base{margin-top:18px}.status{font-size:9px}}
</style></head><body><main class="instrument" aria-label="Simulated bedside blood pressure monitor"><header class="device-header"><div class="brand">lumi<span>CARE SYSTEMS · DEMO</span></div><div class="device-type">BLOOD PRESSURE<small>NON-INVASIVE · AUTOMATIC</small></div></header><div class="face"><div class="screen-bezel"><div class="screen"><canvas width="480" height="360" aria-label="Synthetic blood pressure monitor"></canvas><div class="measuring" id="measuring" hidden><i class="spinner"></i><span>Simulating measurement…</span></div></div></div><div class="side"><span class="power"><i class="led"></i>POWER</span><button id="start" class="start" aria-label="Start simulated measurement"><span class="power-symbol">⏻</span><span>START / STOP</span></button><span class="side-label">NIBP</span></div></div><div class="base"><span class="status" id="status" role="status">Reading complete</span><div class="vents" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span class="model">HOS-BP-1</span></div></main><div class="desk"><details class="settings"><summary>Adjust readings</summary><div class="settings-content"><h2>Simulated values</h2><div class="inputs"><label>SYS<input id="sys" type="number" min="0" max="999" step="1" value="124"></label><label>DIA<input id="dia" type="number" min="0" max="999" step="1" value="82"></label><label>PULSE<input id="pulse" type="number" min="0" max="999" step="1" value="72"></label></div><button id="apply">Update monitor</button><p id="error" class="error" role="alert" hidden>Enter whole numbers from 0 to 999.</p></div></details><button id="full">Full screen</button></div><p class="disclosure">SIMULATION · No cuff or patient connected</p><script>

const FONT={"H": "101101111101101", "O": "111101101101111", "S": "111100111001111", "B": "110101110101110", "P": "110101110100100", "Y": "101101010010010", "D": "110101101101110", "I": "111010010010111", "A": "010101111101101", "U": "101101101101111", "L": "100100100100111", "E": "111100110100111", "m": "000111111101101", "g": "000111101001111", "b": "100100110101110", "p": "000110101110100", "-": "000000111000000", "1": "010110010010111"},DIGITS=["abcdef", "bc", "abged", "abgcd", "fgbc", "afgcd", "afgecd", "abc", "abcdefg", "abcdfg"],RECTS={"a": [7, 2, 20, 5], "b": [27, 8, 5, 21], "c": [27, 35, 5, 21], "d": [7, 57, 20, 5], "e": [2, 35, 5, 21], "f": [2, 8, 5, 21], "g": [7, 30, 20, 5]};
const ctx=document.querySelector('canvas').getContext('2d');
function draw(){const values=['sys','dia','pulse'].map(id=>Number(document.getElementById(id).value));if(values.some(n=>!Number.isInteger(n)||n<0||n>999))return;ctx.fillStyle='#ebebeb';ctx.fillRect(0,0,480,360);ctx.fillStyle='#191919';const rect=(x,y,w,h)=>ctx.fillRect(x,y,w,h);function text(s,x,y){[...s].forEach((c,k)=>[...FONT[c]].forEach((b,i)=>{if(b==='1')rect(x+k*16+i%3*4,y+Math.floor(i/3)*4,4,4)}))};[[12,12,456,4],[12,344,456,4],[12,12,4,336],[464,12,4,336]].forEach(r=>rect(...r));text('HOS-BP-1',32,30);['SYS','DIA','PULSE'].forEach((label,row)=>{const y=72+row*88;text(label,32,y+20);text(row===2?'bpm':'mmHg',350,y+20);[...String(values[row]).padStart(3,'0')].forEach((n,slot)=>[...DIGITS[Number(n)]].forEach(a=>{const [x0,y0,w,h]=RECTS[a];rect(190+44*slot+x0,y+y0,w,h)}))});}

let measuringTimer=null;
function stopMeasurement(){clearTimeout(measuringTimer);measuringTimer=null;document.getElementById('measuring').hidden=true;document.getElementById('start').setAttribute('aria-label','Start simulated measurement');}
document.getElementById('apply').onclick=()=>{const valid=['sys','dia','pulse'].every(id=>{const v=document.getElementById(id).value;return v!==''&&Number.isInteger(Number(v))&&Number(v)>=0&&Number(v)<=999});document.getElementById('error').hidden=valid;if(!valid)return;stopMeasurement();draw();document.getElementById('status').textContent='Reading complete';document.querySelector('.settings').open=false;};
document.getElementById('start').onclick=()=>{if(measuringTimer){stopMeasurement();document.getElementById('status').textContent='Stopped · previous reading';return;}document.getElementById('measuring').hidden=false;document.getElementById('start').setAttribute('aria-label','Stop simulated measurement');document.getElementById('status').textContent='Measuring · simulation';measuringTimer=setTimeout(()=>{stopMeasurement();draw();document.getElementById('status').textContent='Reading complete';},3000);};
document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.body.requestFullscreen()}catch{document.getElementById('status').textContent='Use your browser’s full-screen view';}};draw();
</script></body></html>
